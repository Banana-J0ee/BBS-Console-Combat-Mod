b40he00=120     ; Zack                                      600 -> 720
b01he00=120     ; Hades (story)                             450 -> 540
b10he00=120     ; Ice Colossus                              400 -> 480
b20ls00=120     ; Experiment 221                            500 -> 600
b01ls00=120     ; Metamorphosis                             500 -> 600
b02ls00=120     ; Metamorphosis                             500 -> 600
