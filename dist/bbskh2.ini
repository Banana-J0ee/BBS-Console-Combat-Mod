; BBS KH2-style mod - settings.  Read when the game starts.  Delete a line to get its default back.

[MP]
; Maximum MP = Baseline + MaxPerDeckSlot for every command deck slot the character has (filled or not; 3 at the
; start of the game, up to 8) + MaxPerLevel for every level above 1.  On Critical BaselineCritical is used instead
; of Baseline (50 MP at the start and 100 with all 8 slots, against 90 and 140 on the other difficulties).
Baseline=60
BaselineCritical=20
MaxPerDeckSlot=10
MaxPerLevel=0
; A command's MP cost is its original reload time in seconds (Quick Blitz 10, Mega Flare 50 ...; magic by tier, see
; TieredMagic) times this
CostScale=1.0
; 1 = magic costs are spread out by tier: Fire 10, Fira 15, Firaga 20, Dark Firaga 25 - every -ra spell 15, and
; every spell that was 15 / 20 costs 20 / 25.  0 = plain reload times (Fire and Fira both 10, Firaga 15 ...)
TieredMagic=1
; 1 = Cure, Cura and Curaga use up all remaining MP, as in KH2.  0 = they cost like any other command (30)
CureUsesAllMP=1
; The commands only D-Link decks have (Mickey's Holy, Cinderella's, the seven dwarfs, Vanitas's) all reload in 5
; seconds in the game.  1 = they cost by their class, as ordinary commands do - 10, 15 or 20 MP - and the two that
; heal (Cinderella's and Doc) count as cures: all remaining MP, or 30 with CureUsesAllMP=0.  0 = 5 MP each
DLinkCostByClass=1
; 1 = a D-Link can be started while the MP bar is recharging: a D-Link is not a command and costs no MP (the
; commands of its deck wait for the bar like any others).  0 = no new D-Link until the bar is back
DLinkDuringCharge=1
; 1 = starting a D-Link fills the MP bar, and ends an MP charge if one is running, as a Drive Form does in KH2.
; 0 = a D-Link leaves the bar as it is
DLinkRefillsMP=1
; How much of a full D-Link gauge (percent) can be left once a D-Link has ended - reverted from the list, run out,
; ended by its finisher or by the game.  The game keeps the time that was left, so a link ended early is ready again
; after a hit or two.  KH2's Drive Forms spend their cost when they start and lose the rest of their time when
; you revert: 0 here (the gauge starts again from empty).  100 = the game's way
DLinkGaugeAfter=0
; MP charge: seconds the bar takes to come back once it is empty.  (KH2's is 50.)
ChargeSeconds=25
; MP Haste.  The game's Magic Haste ability is this mod's MP Haste: every copy installed adds MPHasteBonus to a
; bonus, and the charge takes ChargeSeconds / (1 + the bonus): 22.7 s with one copy, 20.8 with two, 16.7 with five,
; 12.5 with ten.  (KH2's rule; its MP Haste is 0.25.)  0 = the ability does nothing and keeps the game's name
MPHasteBonus=0.10
; 1 = it is shown as "MP Haste", with a description of what it does here (English game text only).
; 0 = the game's name and description stay
MPHasteRename=1
; Texts of your own for it, used in any language.  \n is a line break; the description can be as long as the
; game's own (125 bytes in English) and is cut after that.
;MPHasteName=MP Haste
;MPHasteHelp=Makes MP recharge 10% faster once you have run out.\nMulti-install the ability for an even quicker recharge.
; MP Rage (KH2).  The game's Attack Haste ability is this mod's MP Rage: damage you take gives MP back, nothing
; during an MP charge (KH2's rule).  MPRage is the percent of your MP bar you get back for losing a full HP bar
; with the full stack of 5 copies installed; fewer copies give a share of it (one copy: a fifth).  With 25: a full
; HP bar lost gives a quarter of the MP bar at 5 copies, 5% at one copy; half your HP lost at 3 copies gives 7.5%.
; (Weaker than KH2 Final Mix, where one copy alone gives 75 MP for a full HP bar.)  0 = the ability does nothing
; and keeps the game's name
MPRage=25
; 1 = it is shown as "MP Rage", with a description of what it does here (English game text only)
MPRageRename=1
; Texts of your own for it (the description can be 126 bytes long).
;MPRageName=MP Rage
;MPRageHelp=Restores some MP whenever you take damage, except\nduring an MP charge. Multi-install the ability to\nrestore even more.
; Berserker.  The game's Reload Boost ability (faster reloads under a quarter of HP) is this mod's Berserker: while
; the MP bar is recharging, everything you deal is this many percent higher.  Nothing else - no change to combos or
; finishers, and HP plays no part.  The bonus is rounded up to a whole number, so every hit gains at least 1:
; at 5 percent a hit of 1 to 20 gains 1, 21 to 40 gains 2, 100 gains 5.  0 = off, and the ability keeps the
; game's name
BerserkerDamage=5
; 1 = it is shown as "Berserker", with a description of what it does here (English game text only).  0 = the
; game's name and description stay
BerserkerRename=1
; Texts of your own for it, used in any language (the description: up to 97 bytes in English)
;BerserkerName=Berserker
;BerserkerHelp=Increases the damage you deal by 5% while MP is\nrecharging.
; 1 = Ether, Mega-Ether, Elixir and Megalixir restore MP (50 / 100 / 100 / 100 percent) as well as Focus, and
; their descriptions say so (English game text)
EtherRestoresMP=1
; Standing on a save point refills MP, and finishes an MP charge, within this many seconds (0 = off)
SavePointSeconds=1
; 1 = after a command is used the cursor moves on to the next one, as in the original game
CursorAdvance=0

[Cost]
; MP cost of single commands, overriding everything above: <command id in hex>=<MP>, e.g. 83=12 for Fire.
; A cure with a cost here costs that and no longer takes all MP.
; (Ids: 83 Fire, 84 Fira, 85 Firaga, 8a Blizzard, 8e Thunder, 92 Cure, 9c Magnet, a2 Aero, ac Mega Flare ...
; D-Link only: e4 Holy, e5 Wish Circle, e6 Enchanted Step, e7 Wish Shot, e8 Cinderella's heal, e9 Doc, ea Grumpy,
; eb Sneezy, ec Happy, ed Sleepy, ee Bashful, ef Dopey, f0 Dark Spiral, f1 Dark Splicer)

[Bar]
Show=1
; 1 = KH2's own MP bar art (blue gradient bar with the "MP" plate at its right end).  0 = a plain bar
KH2Art=1
; 1 = the bar's left end is round, as in KH2.  0 = square
RoundEnd=1
; 1 = the bar is drawn at exactly the size and place set here.  0 = on the game's own grid for unscaled sprites
; (whole units of its 480 x 272 screen), as before this option: 8 high with borders of 1, and the round end and
; the "MP" plate do not line up with the rest
ExactSize=1
; Right end and top edge of the bar in the game's own screen units (480 x 272), and its thickness.  The Focus
; bar's outline ends at about y 253.9, so a Top above 254 runs into it.  (The first versions of the bar were
; Top 255.5, Height 7.5, BarLength 50.)
Right=425
Top=254.6
Height=4.5
; Length of the bar itself at 100 MP, and how much of any MP above 100 lengthens it (0 = fixed, 1 = in proportion).
; The "MP" plate adds 2.6 x Height to the right of it (57.6 + 11.7 = the 69.5 the first bar was long with its plate)
BarLength=57.6
Growth=0.4
; Tints, as AABBGGRR hex.  80 leaves the art's own colour, ff doubles it.  The letters and the recharge bar are
; grey in the art and get their colour here.
Fill=80808080
Label=80ff9030
Empty=80381810
Frame=80808080
BurnFill=80b860ff
BurnLabel=80c060ff
BurnEmpty=80280c20

[Combat]
; The minimum damage per hit that the game gives you with EXP Zero: a hit that would do less is raised to a
; minimum that depends on the enemy's maximum HP and on the kind of attack (basic attacks < commands and magic <
; the biggest commands).  Stronger hits are not changed.
; 1 = on Critical it applies all the time, with or without the ability   2 = the same on every difficulty
; 0 = only with EXP Zero equipped, as in the original game
DamageFloor=1
; Combo Master (as in the other KH games): a new ability, listed under Support in the camp's Abilities menu like
; EXP Zero - one entry, unlocked from the start, off until you switch it on there.  Like the other abilities, the
; choice is kept in each save file, so every save (character) has its own.  While it is on, your Attack combo keeps
; going when its hits miss, instead of stopping after a swing that hits nothing (each next hit still starts no
; sooner than after a real hit).  0 = the ability is not there at all.
ComboMaster=1
; Texts of your own for it, used in any language (\n is a line break).
;ComboMasterName=Combo Master
;ComboMasterHelp=Lets you keep your Attack combo going even when your\nattacks miss.

[Bundle]
; The three earlier mods are built in.  0 switches one off.
; Combo Flow: walk out of attacks and spells early.  Camera: KH2-style camera.  Revenge Value: bosses take
; your combo until a hidden counter fills, then break out.
ComboFlow=1
Camera=1
RevengeValue=1

[CommandCancel]
; Command cancel: a deck command (attack or magic) can be cut short once it is over - its last hit is done, plus
; [Speed] FollowThrough (3 frames), plus the delay given for it below.  Whatever you press then (another command,
; the same one again, Attack, guard, dodge, jump, shotlock ...) starts at once; press nothing and the animation
; plays to its end.  Finishers, the base combo, items, D-Link and team attacks, shotlocks and reaction commands are
; not changed.  Commands you press again (Blitz, Ars Arcanum ...) are only cut short once no press can continue
; them.  Needs [Speed] Enabled=1.  0 = off
Enabled=1
; A press up to this many frames (1/30 s) before the moment is held and goes out then
BufferFrames=8
; Per command: frames (1/30 s) after "over" before it can be cut short.  0 = as soon as it is over; 15 = half a
; second later.  No negative values (not earlier than its last hit).  Lines starting with ; are commands that run
; their own ending (several parts, or presses) and cannot be cut short yet; their numbers are read once they are.
; Attack commands
Quick Blitz=0
Blitz=0
