[Bosses]
; Boss pace (needs RevengeValue=1).  BBS's humanoid bosses stand around 1.5-2 s between attacks and walk towards
; you for up to 5-12 s; KH2's wait 0.25-0.75 s and walk 1-2 s before they attack.  Their waits in idle states are
; multiplied by Aggression (1 = vanilla), never below 0.75 s (shorter waits stay), and their walks are cut off
; after WalkCap seconds (0 = no cap).  Attacks are not changed.  The Final Mix superbosses (Mysterious Figure,
; Armor of the Master, No Heart, Vanitas Remnant) and Hades keep their own pace; large bosses are never changed.
Aggression=0.4
WalkCap=2.0

[BossHP]
; Story bosses get more HP the further into the game they are, in percent of the game's own value (100 = vanilla).
; The opening bosses are unchanged; the Final Mix superbosses (Mysterious Figure, Armor of the Master, No Heart,
; Vanitas Remnant), Dark Hide, the Mirage Arena and the minigames are not listed and keep theirs, so the
; superbosses stay the toughest fights.  Max and current HP both change.  Any boss can be added by its code.
; EXP Zero's minimum damage (DamageFloor) treats a boss with more than 1500 HP as 1500, the end of its table.
; Enabled=0: every boss keeps its own HP.
Enabled=1
