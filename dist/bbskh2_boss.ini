SpecialCommandAttack1 = all, cooldown 15
SpecialCommandAttack2 = all, cooldown 15
SpecialCommandAttack3 = all, cooldown 15
SpecialCommandAttack4 = all, cooldown 15
SpecialCommandAttack5 = all, cooldown 15
SpecialCommandAttack6 = all, cooldown 15
SpecialCommandAttack7 = all, cooldown 15
SpecialCommandAttack8 = all, cooldown 15
SpecialCommandAttack9 = all, cooldown 15
