; bbskh2_boss.ini - boss timing for BBS KH2-Style (read each time a boss appears: edit, then start the fight again)
;
; One section per boss.  Ids = the game's names for that boss's fights (do not change them).
;
; Moves:  <move> = <armour>[, cooldown <seconds>]
;   <armour> is how long the boss cannot be staggered once he starts that move:
;     a number   frames at 60 per second, counted from the start of the move (time spent invisible in a warp does
;                not count).  After that the rest of the move can be staggered.
;     all        the whole move
;     vanilla    exactly as the game has it (also used for moves that only need a cooldown)
;   cooldown     seconds before he may use that move again.  If everything he could pick is cooling down, he uses
;                the one that is closest to ready (he never stands around waiting for a cooldown).
;
; Gaps between attacks:
;   Beat = a-b         frames between two attacks (random in the range; 60 = 1 second)
;   Chain = a-b        attacks in a row before he moves away with one of the Reposition moves
;   Reposition = ...   his moves for getting away / repositioning
;   Pause = p, a-b     after moving away: p percent chance to hold back for a-b frames instead of the beat;
;                      he breaks the pause with an attack if you come within PauseNear metres
;   PauseNear = m
;
; Revenge values and break-outs are not in this file: they are unchanged.

[Vanitas]
; Masked Vanitas, Ventus / Terra / Aqua's story fights.  The keyblade ride is not changed.
Ids = b10ex00, b10ex01, b10ex02
Beat = 15-24
Chain = 2-4
Reposition = BackhandsSpringJump, Cartwheel
Pause = 25, 60-120
PauseNear = 3
; his sword combo: armoured through the opening swing, the rest of the combo can be staggered
SuccessionAttack1 = 36
SuccessionAttack2 = 36
; armoured until the spell comes out
DarkFiraga = 48, cooldown 3
DarkThundaga = 34
; warp attacks: the warp and the strike are armoured, the landing is open
Warp1 = vanilla, cooldown 10
Warp2 = vanilla, cooldown 10
WarpAttack1 = 26
WarpAttack2 = 42
ShadowDiving = all, cooldown 45
Cartwheel = vanilla
BackhandsSpringJump = vanilla

